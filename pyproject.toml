[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-tool"
version = "0.1.0"
description = "Command-line math function parser and plotter with LaTeX support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.13",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "antlr4-python3-runtime>=4.11,<4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
math-tool = "math_tool.cli:main"
math-tool-gui = "math_tool.gui:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]